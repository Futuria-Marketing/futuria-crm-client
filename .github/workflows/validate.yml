name: validate-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Valida script macOS
        run: bash -n skills/futuria-crm/scripts/setup-credentials.sh skills/futuria-crm/scripts/launch-credential-setup.sh skills/futuria-crm/scripts/crm-api.sh skills/futuria-crm/scripts/state-dir.sh
      - name: Valida script PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('skills/futuria-crm/scripts/setup-credentials.ps1', 'skills/futuria-crm/scripts/launch-credential-setup.ps1', 'skills/futuria-crm/scripts/crm-api.ps1', 'skills/futuria-crm/scripts/state-dir.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Valida plugin (white-label, JSON, skill, reference)
        run: python scripts/validate-plugin.py
      - name: Test contratti del pacchetto unico
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Test archivio riproducibile e perimetro dei file distribuiti
        run: python -B tests/build-release.test.py

  credential-wizard:
    name: credential-wizard (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Versione minima dichiarata in INSTALL.md e versione attuale.
        node: ["20", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Sintassi Bash 3.2 di macOS
        if: runner.os == 'macOS'
        run: for file in skills/futuria-crm/scripts/*.sh; do /bin/bash -n "$file"; done
      - name: Test configuratore e cartella di stato
        run: node --test tests/*.test.mjs
      - name: Test PowerShell con pwsh 7
        if: runner.os == 'Windows'
        env:
          FUTURIA_TEST_POWERSHELL: pwsh
        run: node --test tests/state-dir.test.mjs
